name: Merchant preview M01-M04 mobile acceptance

on:
  push:
    branches:
      - audit/merchant-preview-mobile-gate-20261113

permissions:
  contents: read

jobs:
  check-exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: M01 CSV and M04 JSON-LD in touch-enabled Chromium 390x844
        run: node scripts/merchant-preview-mobile-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-preview-mobile-m01-m04
          path: artifacts/merchant-preview-mobile-20261113/
          if-no-files-found: warn
          retention-days: 30

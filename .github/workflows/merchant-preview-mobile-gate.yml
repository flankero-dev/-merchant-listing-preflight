name: Merchant production post-release M01-M04 and HTTP

on:
  push:
    branches:
      - audit/merchant-preview-mobile-gate-20261113

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production routes PNG M01 CSV and M04 in Chromium 390x844
        run: node scripts/merchant-preview-mobile-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-production-postrelease-20261113
          path: artifacts/merchant-production-postrelease-20261113/
          if-no-files-found: warn
          retention-days: 30
